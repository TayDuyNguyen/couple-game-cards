
<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Game Hub - Kết nối yêu thương</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                magenta: '#FF2D55',
                wine: '#1A0B0E',
                wineLight: '#2D161A',
              },
              glass: {
                white: 'rgba(255, 255, 255, 0.05)',
                dark: 'rgba(0, 0, 0, 0.3)',
              }
            },
            fontFamily: {
              jakarta: ['Plus Jakarta Sans', 'sans-serif'],
              quicksand: ['Quicksand', 'sans-serif'],
            },
            animation: {
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" />
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #1A0B0E;
        color: #FFFFFF;
        scroll-behavior: smooth;
      }
      
      .bg-wine-gradient {
        background: radial-gradient(circle at top right, #2D161A, #1A0B0E);
      }

      .glass-panel {
        background: rgba(26, 11, 14, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255, 45, 85, 0.2);
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .neon-shadow {
        box-shadow: 0 0 20px rgba(255, 45, 85, 0.4);
      }

      .text-glow {
        text-shadow: 0 0 10px rgba(255, 45, 85, 0.5);
      }

      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob {
        animation: blob 7s infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0"
  }
}
</script>
</head>
  <body class="bg-brand-wine text-white">
    <div id="root"></div>
    <script type="module" src="main.tsx"></script>
  </body>
</html>
